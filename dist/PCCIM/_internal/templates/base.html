<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PCCSIM</title>

    <!-- Link to static/css/style.css -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <!-- Choices.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>

<header ondblclick="window.location.href='{{ url_for('batch_import_page') }}'" style="cursor: pointer; user-select: none;" title="Double click for Batch Import">
    PCCSIM
</header>

<nav>
    <a href="{{ url_for('apply') }}">Application</a>
    <a href="{{ url_for('search') }}">Search</a>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

    <!-- Choices.js JS -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const labelSelects = document.querySelectorAll('.labels-select');
            window.choicesInstances = {};
            
            labelSelects.forEach(function(select) {
                const choices = new Choices(select, {
                    removeItemButton: true,
                    searchPlaceholderValue: 'Search labels...',
                    shouldSort: false,
                    placeholderValue: 'Select labels...'
                });
                window.choicesInstances[select.id] = choices;
            });
        });
    </script>
</body>
</html>
