<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>PCCIM 申請系統</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 18px 30px;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            background: white;
            padding: 12px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        nav button {
            border: none;
            background: #e9eef5;
            color: #1f4e79;
            padding: 10px 22px;
            margin-right: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        nav button.active {
            background: #1f4e79;
            color: white;
        }

        .container {
            padding: 25px 30px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #1f4e79;
            border-bottom: 2px solid #e6ecf2;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444;
        }

        input, select, textarea {
            padding: 9px 10px;
            border: 1px solid #ccd3dd;
            border-radius: 7px;
            font-size: 14px;
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        input[readonly] {
            background: #f1f3f5;
            color: #555;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .image-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .image-box {
            border: 1px dashed #9aa8b8;
            border-radius: 12px;
            padding: 14px;
            background: #fafbfc;
        }

        .image-box img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
        }

        .btn {
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .btn-primary {
            background: #1f4e79;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        .btn-area {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 14px;
        }

        th {
            background: #1f4e79;
            color: white;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            border-bottom: 1px solid #e3e7ed;
            padding: 9px;
            white-space: nowrap;
        }

        tr:hover {
            background: #f5f9ff;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            background: #e8f1fb;
            color: #1f4e79;
            font-size: 12px;
            font-weight: bold;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 8px;
            background: #dff0d8;
            color: #2e6b2e;
            font-weight: bold;
        }

        .required {
            color: red;
        }

        @media (max-width: 1100px) {
            .form-grid,
            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .content-grid,
            .image-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .form-grid,
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    PCCIM 申請系統
</header>

<nav>
    <button id="applyTab" class="active" onclick="showPage('apply')">申請介面</button>
    <button id="searchTab" onclick="showPage('search')">搜尋介面</button>
</nav>

<div class="container">

    <!-- 申請介面 -->
    <section id="applyPage" class="page active">

        <div id="successMessage" class="message">
            申請資料已暫存成功，可至搜尋介面查看。
        </div>

        <form id="pccimForm">

            <div class="card">
                <h2>基本資訊</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label>申請單號</label>
                        <input type="text" id="requestNo" readonly>
                    </div>

                    <div class="form-group">
                        <label>申請日期</label>
                        <input type="text" id="applyDate" readonly>
                    </div>

                    <div class="form-group">
                        <label>Title <span class="required">*</span></label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group">
                        <label>IN/DN</label>
                        <select id="inDn">
                            <option value="">請選擇</option>
                            <option value="IN">IN</option>
                            <option value="DN">DN</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Create Date</label>
                        <input type="date" id="createDate">
                    </div>

                    <div class="form-group">
                        <label>Close Date</label>
                        <input type="date" id="closeDate">
                    </div>

                    <div class="form-group">
                        <label>Machine</label>
                        <input type="text" id="machine">
                    </div>

                    <div class="form-group">
                        <label>Module Name</label>
                        <input type="text" id="moduleName">
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" id="department">
                    </div>

                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="author">
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>內容</h2>

                <div class="content-grid">
                    <div class="form-group">
                        <label>Problem Description</label>
                        <textarea id="problemDescription"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Action Taken</label>
                        <textarea id="actionTaken"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Impact Container</label>
                        <textarea id="impactContainer"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Need Help From PE/DE</label>
                        <textarea id="needHelp"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Root Cause</label>
                        <textarea id="rootCause"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Solution</label>
                        <textarea id="solution"></textarea>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>附件圖片</h2>
                <p>僅支援圖片格式，最多可新增 10 張圖片，每張圖片下方可填寫備註。</p>

                <div id="imageSection" class="image-section"></div>
            </div>

            <div class="btn-area">
                <button type="button" class="btn btn-secondary" onclick="resetForm()">清除</button>
                <button type="submit" class="btn btn-primary">送出申請</button>
            </div>

        </form>
    </section>

    <!-- 搜尋介面 -->
    <section id="searchPage" class="page">

        <div class="card">
            <h2>搜尋條件</h2>

            <div class="filter-grid">
                <div class="form-group">
                    <label>申請日期</label>
                    <input type="date" id="filterApplyDate" oninput="renderTable()">
                </div>

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="filterTitle" oninput="renderTable()">
                </div>

                <div class="form-group">
                    <label>IN/DN</label>
                    <select id="filterInDn" onchange="renderTable()">
                        <option value="">全部</option>
                        <option value="IN">IN</option>
                        <option value="DN">DN</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Create Date</label>
                    <input type="date" id="filterCreateDate" oninput="renderTable()">
                </div>

                <div class="form-group">
                    <label>Close Date</label>
                    <input type="date" id="filterCloseDate" oninput="renderTable()">
                </div>

                <div class="form-group">
                    <label>Machine</label>
                    <input type="text" id="filterMachine" oninput="renderTable()">
                </div>

                <div class="form-group">
                    <label>Module Name</label>
                    <input type="text" id="filterModuleName" oninput="renderTable()">
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="filterDepartment" oninput="renderTable()">
                </div>

                <div class="form-group">
                    <label>Author</label>
                    <input type="text" id="filterAuthor" oninput="renderTable()">
                </div>
            </div>

            <div class="btn-area">
                <button class="btn btn-secondary" onclick="clearFilters()">清除篩選</button>
                <button class="btn btn-danger" onclick="clearAllData()">清除全部暫存資料</button>
            </div>
        </div>

        <div class="card">
            <h2>搜尋結果</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>申請日期</th>
                            <th>Title</th>
                            <th>IN/DN</th>
                            <th>Create Date</th>
                            <th>Close Date</th>
                            <th>Machine</th>
                            <th>Module Name</th>
                            <th>Department</th>
                            <th>Author</th>
                            <th>申請單號</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody">
                    </tbody>
                </table>
            </div>
        </div>

    </section>

</div>

<script>
    const STORAGE_KEY = "pccim_applications";

    window.onload = function () {
        initializeForm();
        createImageInputs();
        renderTable();
    };

    function showPage(page) {
        document.getElementById("applyPage").classList.remove("active");
        document.getElementById("searchPage").classList.remove("active");
        document.getElementById("applyTab").classList.remove("active");
        document.getElementById("searchTab").classList.remove("active");

        if (page === "apply") {
            document.getElementById("applyPage").classList.add("active");
            document.getElementById("applyTab").classList.add("active");
        } else {
            document.getElementById("searchPage").classList.add("active");
            document.getElementById("searchTab").classList.add("active");
            renderTable();
        }
    }

    function initializeForm() {
        document.getElementById("requestNo").value = generateRequestNo();
        document.getElementById("applyDate").value = getToday();
    }

    function generateRequestNo() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        const hour = String(now.getHours()).padStart(2, "0");
        const minute = String(now.getMinutes()).padStart(2, "0");
        const second = String(now.getSeconds()).padStart(2, "0");
        return `PCCIM-${year}${month}${day}-${hour}${minute}${second}`;
    }

    function getToday() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function createImageInputs() {
        const section = document.getElementById("imageSection");
        section.innerHTML = "";

        for (let i = 1; i <= 10; i++) {
            const box = document.createElement("div");
            box.className = "image-box";

            box.innerHTML = `
                <div class="form-group">
                    <label>圖片 ${i}</label>
                    <input type="file" id="image${i}" accept="image/*" onchange="previewImage(${i})">
                </div>

                <div id="previewArea${i}"></div>

                <div class="form-group" style="margin-top:10px;">
                    <label>圖片 ${i} 備註</label>
                    <textarea id="imageRemark${i}" placeholder="請輸入圖片備註"></textarea>
                </div>
            `;

            section.appendChild(box);
        }
    }

    function previewImage(index) {
        const input = document.getElementById(`image${index}`);
        const previewArea = document.getElementById(`previewArea${index}`);
        previewArea.innerHTML = "";

        if (!input.files || !input.files[0]) {
            return;
        }

        const file = input.files[0];

        if (!file.type.startsWith("image/")) {
            alert("僅可上傳圖片格式。");
            input.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onload = function (e) {
            const img = document.createElement("img");
            img.src = e.target.result;
            previewArea.appendChild(img);
        };

        reader.readAsDataURL(file);
    }

    document.getElementById("pccimForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const data = {
            requestNo: document.getElementById("requestNo").value,
            applyDate: document.getElementById("applyDate").value,
            title: document.getElementById("title").value,
            inDn: document.getElementById("inDn").value,
            createDate: document.getElementById("createDate").value,
            closeDate: document.getElementById("closeDate").value,
            machine: document.getElementById("machine").value,
            moduleName: document.getElementById("moduleName").value,
            department: document.getElementById("department").value,
            author: document.getElementById("author").value,
            problemDescription: document.getElementById("problemDescription").value,
            actionTaken: document.getElementById("actionTaken").value,
            impactContainer: document.getElementById("impactContainer").value,
            needHelp: document.getElementById("needHelp").value,
            rootCause: document.getElementById("rootCause").value,
            solution: document.getElementById("solution").value,
            images: []
        };

        for (let i = 1; i <= 10; i++) {
            const input = document.getElementById(`image${i}`);
            const remark = document.getElementById(`imageRemark${i}`).value;

            if (input.files && input.files[0]) {
                data.images.push({
                    imageNo: i,
                    fileName: input.files[0].name,
                    remark: remark
                });
            }
        }

        const records = getRecords();
        records.push(data);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

        document.getElementById("successMessage").style.display = "block";

        setTimeout(() => {
            document.getElementById("successMessage").style.display = "none";
        }, 3000);

        resetForm();
        renderTable();
    });

    function getRecords() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    }

    function resetForm() {
        document.getElementById("pccimForm").reset();
        initializeForm();
        createImageInputs();
    }

    function renderTable() {
        const records = getRecords();

        const filterApplyDate = document.getElementById("filterApplyDate").value.toLowerCase();
        const filterTitle = document.getElementById("filterTitle").value.toLowerCase();
        const filterInDn = document.getElementById("filterInDn").value.toLowerCase();
        const filterCreateDate = document.getElementById("filterCreateDate").value.toLowerCase();
        const filterCloseDate = document.getElementById("filterCloseDate").value.toLowerCase();
        const filterMachine = document.getElementById("filterMachine").value.toLowerCase();
        const filterModuleName = document.getElementById("filterModuleName").value.toLowerCase();
        const filterDepartment = document.getElementById("filterDepartment").value.toLowerCase();
        const filterAuthor = document.getElementById("filterAuthor").value.toLowerCase();

        const filtered = records.filter(item => {
            return match(item.applyDate, filterApplyDate)
                && match(item.title, filterTitle)
                && match(item.inDn, filterInDn)
                && match(item.createDate, filterCreateDate)
                && match(item.closeDate, filterCloseDate)
                && match(item.machine, filterMachine)
                && match(item.moduleName, filterModuleName)
                && match(item.department, filterDepartment)
                && match(item.author, filterAuthor);
        });

        const tbody = document.getElementById("resultBody");
        tbody.innerHTML = "";

        if (filtered.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="10" style="text-align:center; padding:20px;">
                        查無資料
                    </td>
                </tr>
            `;
            return;
        }

        filtered.forEach(item => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${safeText(item.applyDate)}</td>
                <td>${safeText(item.title)}</td>
                <td><span class="tag">${safeText(item.inDn)}</span></td>
                <td>${safeText(item.createDate)}</td>
                <td>${safeText(item.closeDate)}</td>
                <td>${safeText(item.machine)}</td>
                <td>${safeText(item.moduleName)}</td>
                <td>${safeText(item.department)}</td>
                <td>${safeText(item.author)}</td>
                <td>${safeText(item.requestNo)}</td>
            `;

            tbody.appendChild(tr);
        });
    }

    function match(value, keyword) {
        if (!keyword) return true;
        return String(value || "").toLowerCase().includes(keyword);
    }

    function safeText(value) {
        return value || "";
    }

    function clearFilters() {
        document.getElementById("filterApplyDate").value = "";
        document.getElementById("filterTitle").value = "";
        document.getElementById("filterInDn").value = "";
        document.getElementById("filterCreateDate").value = "";
        document.getElementById("filterCloseDate").value = "";
        document.getElementById("filterMachine").value = "";
        document.getElementById("filterModuleName").value = "";
        document.getElementById("filterDepartment").value = "";
        document.getElementById("filterAuthor").value = "";
        renderTable();
    }

    function clearAllData() {
        if (confirm("確定要清除全部暫存資料嗎？")) {
            localStorage.removeItem(STORAGE_KEY);
            renderTable();
        }
    }
</script>

</body>
</html>
