{% extends "base.html" %}

{% block content %}

<form method="POST" enctype="multipart/form-data">

    <section class="card">
        <h2>基本資訊</h2>

        <div class="form-grid">
            <div class="form-group">
                <label>申請單號</label>
                <input type="text" value="系統自動產生" readonly>
            </div>

            <div class="form-group">
                <label>申請日期</label>
                <input type="text" value="系統自動產生" readonly>
            </div>

            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" name="title" required>
            </div>

            <div class="form-group">
                <label>IN/DN</label>
                <select name="in_dn">
                    <option value="">請選擇</option>
                    <option value="IN">IN</option>
                    <option value="DN">DN</option>
                </select>
            </div>

            <div class="form-group">
                <label>Create Date</label>
                <input type="date" name="create_date">
            </div>

            <div class="form-group">
                <label>Close Date</label>
                <input type="date" name="close_date">
            </div>

            <div class="form-group">
                <label>Machine</label>
                <input type="text" name="machine">
            </div>

            <div class="form-group">
                <label>Module Name</label>
                <input type="text" name="module_name">
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department">
            </div>

            <div class="form-group">
                <label>Author</label>
                <input type="text" name="author">
            </div>
        </div>
    </section>

    <section class="card">
        <h2>內容</h2>

        <div class="content-grid">
            <div class="form-group">
                <label>Problem Description</label>
                <textarea name="problem_description"></textarea>
            </div>

            <div class="form-group">
                <label>Action Taken</label>
                <textarea name="action_taken"></textarea>
            </div>

            <div class="form-group">
                <label>Impact Container</label>
                <textarea name="impact_container"></textarea>
            </div>

            <div class="form-group">
                <label>Need Help From PE/DE</label>
                <textarea name="need_help"></textarea>
            </div>

            <div class="form-group">
                <label>Root Cause</label>
                <textarea name="root_cause"></textarea>
            </div>

            <div class="form-group">
                <label>Solution</label>
                <textarea name="solution"></textarea>
            </div>
        </div>
    </section>

    <section class="card">
        <h2>附件</h2>
        <p class="section-hint">
            支援圖片與 PowerPoint 檔案，最多可上傳 10 個附件，每個附件可填寫備註。
            <br>
            支援格式：png、jpg、jpeg、gif、bmp、webp、ppt、pptx
        </p>

        <div class="image-grid">
            {% for i in range(1, max_image_count + 1) %}
            <div class="image-box">
                <div class="image-box-header">
                    <span class="image-badge">附件 {{ i }}</span>
                </div>

                <div class="form-group">
                    <label for="attachment_{{ i }}">選擇附件</label>
                    <input
                        type="file"
                        id="attachment_{{ i }}"
                        name="attachment_{{ i }}"
                        accept="image/*,.ppt,.pptx"
                    >
                </div>

                <div class="form-group">
                    <label for="attachment_remark_{{ i }}">附件備註</label>
                    <textarea
                        id="attachment_remark_{{ i }}"
                        name="attachment_remark_{{ i }}"
                        placeholder="請輸入附件 {{ i }} 的備註"
                    ></textarea>
                </div>
            </div>
            {% endfor %}
        </div>
    </section>

    <div class="button-area">
        <button type="reset" class="btn secondary">清除</button>
        <button type="submit" class="btn primary">送出申請</button>
    </div>

</form>

{% endblock %}
